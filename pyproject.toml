[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bankshield-analytics"
version = "0.1.0"
description = "Plataforma académica de analítica financiera"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fraud = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
