name: Pruebas Python

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        # Las pruebas usan fixtures pequeños; no requieren descargar Bronze con LFS.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/common.txt
      - name: Instalar entorno común
        run: python -m pip install -r requirements/common.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests/unit -v
